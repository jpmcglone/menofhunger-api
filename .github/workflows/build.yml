name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm run check:env-docs
      - run: node --test scripts/kill-port.test.mjs
      - run: npm run lint

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run build:typecheck
      - run: npm run check:contracts
      - run: npm run test:ci
      - run: npm run test:partner-protocol
      - run: npm run check:partner-example
      - run: npm run check:partner-reference
      - run: npm run check:partner-docs
