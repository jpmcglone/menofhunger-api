# Docker alternative; the existing dashboard-managed API uses native Node.
# Apply the trigger and filters to the existing service without changing runtime.
#
# If this service is already dashboard-managed (no Blueprint linked), do NOT
# apply this file as a new Blueprint — that can create a second service.
# Copy healthCheckPath + maxShutdownDelaySeconds into Settings instead.
# See DEPLOYMENT.md.
#
# Do not attach a persistent disk. That disables zero-downtime deploys.
services:
  - type: web
    name: menofhunger-api
    autoDeployTrigger: checksPass
    buildFilter:
      ignoredPaths:
        - .agents/**
        - .cursor/**
        - .vscode/**
        - AGENTS.md
        - README.md
        - DEPLOYMENT.md
        - docs/engineering-policy.md
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    maxShutdownDelaySeconds: 120
